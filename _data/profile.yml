short_bio: >-
  <p>
    I am an undergraduate student in <strong>Computer Science and Technology</strong> at
    <strong>Tongji University</strong>, Shanghai, expecting to graduate in June 2027
    (GPA 85.04 / 100, 4.0 / 5.0). My interests sit between <strong>data and cloud-native
    systems</strong> and <strong>applied machine learning</strong>: I enjoy taking a complicated system
    apart until its structure is clear, and then building it back so that it is measurable, verifiable
    and reliable.
  </p>
  <p>
    I am the first author of <strong>FSB-Net</strong>, a frequency&ndash;spatial boundary network for brain
    stroke lesion segmentation in non-contrast CT (accepted at IEEE BIBM 2026, CCF-B), and I lead
    <strong>CausIDL</strong>, resource-competition-aware causal graph discovery for deep learning
    microservices. I have also worked as an intern at <strong>JD Technology (JD Cloud)</strong>, where I
    built migration tooling for a data lake project, at <strong>QAX Technology Group</strong>, at the
    <strong>Taiyuan Municipal People's Government</strong>, and at <strong>CCB Fintech</strong>.
  </p>
  <p>
    In July 2025 I attended the Plenary Session on AI Development and Safety at the World Artificial
    Intelligence Conference (WAIC) as a student representative. Outside the lab I play basketball
    (Tongji university and school teams) and badminton. I am happy to talk about systems, data
    engineering, medical image analysis or research in general &mdash; email is the fastest way to reach me.
  </p>

