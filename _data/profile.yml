short_bio: >-
  <p>
    I am an undergraduate student in <strong>Computer Science and Technology</strong> at
    <strong>Tongji University</strong>, Shanghai, expecting to graduate in June 2027
    (GPA 85.04 / 100). My interests sit between <strong>data and cloud-native systems</strong> and
    <strong>applied machine learning</strong>: I enjoy taking a complicated system apart until its
    structure is clear, and then building it back so that it is measurable, verifiable and reliable.
  </p>
  <p>
    Right now I am working on <strong>FSB-Net</strong>, a frequency&ndash;spatial boundary network for brain stroke
    lesion segmentation in non-contrast CT (accepted at IEEE BIBM 2026, CCF-B), and on
    <strong>CausIDL</strong>, resource-competition-aware causal graph discovery for deep learning
    microservices. I have also spent time as an engineering intern at
    <strong>JD Technology (JD Cloud)</strong>, where I built migration tooling for a data lake project,
    and at <strong>CCB Fintech</strong> and <strong>Qihoo 360</strong>.
  </p>
  <p>
    I am happy to talk about systems, data engineering, medical image analysis or research in general &mdash;
    the fastest way to reach me is email.
  </p>

